name: Build Windows EXE

# اجرا در دو حالت:
# 1. وقتی فایل‌های مهم تغییر کنند
# 2. اجرای دستی از تب Actions
on:
  push:
    paths:
      - "darvazeban_v3.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: دریافت فایل‌های پروژه
        uses: actions/checkout@v4

      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: ساخت فایل اجرایی EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --clean `
            --name "Darvazeban" `
            --noconfirm `
            darvazeban_v3.py

      - name: بررسی ایجاد فایل خروجی
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Darvazeban.exe")) {
            throw "فایل dist/Darvazeban.exe ساخته نشد!"
          }
          Get-Item "dist/Darvazeban.exe" | Format-List Name, Length, LastWriteTime

      - name: آپلود فایل EXE
        uses: actions/upload-artifact@v4
        with:
          name: Darvazeban-Windows
          path: dist/Darvazeban.exe
          if-no-files-found: error
          retention-days: 30
